name: Weekly PM Radar Report

on:
  schedule:
    # Runs every Thursday at 1:30 PM UTC (7:00 PM IST)
    - cron: '30 13 * * 4'
  workflow_dispatch:  # Allows manual trigger
    inputs:
      dry_run:
        description: "Generate the report and upload it as an artifact; do NOT email or commit"
        type: boolean
        default: false

jobs:
  generate-report:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright doesn't support yet
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.15'  # Pin exact version for stability

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: |
        python -m playwright install-deps
        python -m playwright install chromium

    - name: Install GitHub CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y gh

    - name: Create recipients config
      run: |
        echo "${{ secrets.RECIPIENTS_YAML }}" > config/recipients.yaml

    - name: Merge extra recipients
      env:
        EXTRA_RECIPIENTS: ${{ secrets.EXTRA_RECIPIENTS }}
      run: python scripts/merge_extra_recipients.py fraud

    - name: Run PM Radar V2 pipeline
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SOCIAVAULT_API_KEY: ${{ secrets.SOCIAVAULT_API_KEY }}
        SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/run_v2_pipeline.py fraud

    - name: Upload report (dry run)
      if: ${{ inputs.dry_run }}
      uses: actions/upload-artifact@v4
      with:
        name: report-dry-run
        path: |
          data/reports/*.md
          data/reports/*.html
        if-no-files-found: error

    - name: Send report email
      if: ${{ !inputs.dry_run }}
      # v2 pipeline's built-in --deliver is a stub; the working sender is the
      # v1 email_sender, which reads recipients from config/recipients.yaml
      # (created above from the RECIPIENTS_YAML secret).
      env:
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      run: python -m scripts.deliver.email_sender

    - name: Commit and push report
      if: ${{ !inputs.dry_run }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/reports/ data/raw/ docs/reports/ || true
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Weekly PM Radar Report - $(date +%Y-%m-%d)

        Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>"
          git push
        fi
